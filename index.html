<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de Lien WhatsApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen">

    <div class="bg-slate-800 p-8 rounded-lg shadow-md w-full max-w-md">
        <h1 class="text-2xl font-bold text-center text-green-500 mb-6">Générateur WhatsApp</h1>

        <div class="mb-4">
            <label class="block text-gray-300 text-sm font-bold mb-2" for="phone">Numéro (ex: 33612345678)</label>
            <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 focus:outline-none focus:border-green-500" id="phone" type="number" placeholder="33612345678">
        </div>

        <div class="mb-6">
            <label class="block text-gray-300 text-sm font-bold mb-2" for="message">Message pré-rempli (facultatif)</label>
            <textarea class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 focus:outline-none focus:border-green-500" id="message" rows="3" placeholder="Bonjour, je voudrais un devis..."></textarea>
        </div>

        <div class="text-center text-sm font-semibold text-gray-600 mb-4">
            Crédits restants : <span id="creditCount" class="text-blue-600">50</span>
        </div>

        <button id="generateBtn" class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded w-full mb-4">
            Générer mon lien
        </button>

        <a id="stripeBtn" href="https://buy.stripe.com/test_6oU3cwgAS0X67pOfGdao800" target="_blank" class="hidden bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded w-full mb-4 text-center block">
            Recharger 50 crédits (Stripe)
        </a>

        <div id="resultArea" class="hidden border-t pt-4 mt-2">
            <p class="text-sm text-gray-300 mb-2">Voici votre lien :</p>
            <input id="resultLink" type="text" readonly class="w-full bg-gray-100 border rounded py-2 px-3 text-sm text-gray-800 mb-3 outline-none">
            <button id="copyBtn" class="bg-gray-800 hover:bg-gray-900 text-white font-bold py-2 px-4 rounded w-full text-sm">
                Copier le lien
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
